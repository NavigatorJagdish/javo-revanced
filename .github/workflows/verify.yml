name: Verify and package development builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: javo-verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.import.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the source commit for all verification jobs
        id: import
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  web-and-security:
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Website and release tests
        run: |
          set -euo pipefail
          mkdir -p evidence tools/java-tests
          node --input-type=module -e "import fs from 'node:fs'; const p='infrastructure/release/catalog.json'; const c=JSON.parse(fs.readFileSync(p)); c.artifacts=[]; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          node --test tests/*.test.mjs | tee evidence/node-tests.log
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee evidence/runtime-evidence-tests.log
          javac -d tools/java-tests apps/javo-manager/app/src/main/java/app/javo/security/UpdateSecurity.java tests/UpdateSecurityTest.java patches/javo-branding/src/main/java/app/javo/branding/BrandingResources.java tests/BrandingResourcesTest.java apps/javo-manager/api/src/main/java/app/revanced/manager/downloader/DownloadConnection.java tests/DownloadConnectionTest.java apps/javo-manager/api/src/main/java/app/revanced/manager/downloader/webview/ApkMirrorPolicy.java tests/ApkMirrorPolicyTest.java
          java -cp tools/java-tests UpdateSecurityTest | tee evidence/java-security-tests.log
          java -cp tools/java-tests BrandingResourcesTest | tee evidence/java-branding-tests.log
          java -cp tools/java-tests DownloadConnectionTest | tee evidence/java-download-tests.log
          java -cp tools/java-tests ApkMirrorPolicyTest | tee evidence/java-browser-tests.log
          node apps/javo-website/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website-and-host-test-evidence
          path: |
            apps/javo-website/dist
            evidence/node-tests.log
            evidence/java-security-tests.log
            evidence/java-branding-tests.log
            evidence/java-download-tests.log
            evidence/java-browser-tests.log
            evidence/runtime-evidence-tests.log
  manager:
    needs: sources
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit test and lint Manager
        working-directory: apps/javo-manager
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../../evidence
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain 2>&1 | tee ../../evidence/manager-build.log
      - name: Verify Manager APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py apps/javo-manager/app/build/outputs/apk/debug/*.apk --sdk "$ANDROID_HOME" --product manager --signing debug
      - name: Build opt-in branding bundle
        working-directory: apps/javo-manager
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          ./gradlew -p ../../patches/javo-branding jar --no-daemon
          mkdir -p ../../patches/javo-branding/build/dex
          "$ANDROID_HOME/build-tools/34.0.0/d8" --min-api 26 --output ../../patches/javo-branding/build/dex ../../patches/javo-branding/build/libs/javo-branding-0.1.0-alpha.1.jar
          python ../../infrastructure/scripts/dex-bundle.py ../../patches/javo-branding/build/libs/javo-branding-0.1.0-alpha.1.jar ../../patches/javo-branding/build/dex/classes.dex
      - name: Export resolved ReVanced build artifacts without credentials
        if: always()
        run: python infrastructure/scripts/export-revanced-dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-revanced-maven-cache
          path: tools/revanced-maven
      - name: Prepare first-party patch integration fixtures
        working-directory: apps/javo-manager
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35'
          python ../../infrastructure/scripts/build-integration-fixture.py --sdk "$ANDROID_HOME"
          ./gradlew :app:assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee ../../evidence/manager-instrumentation-build.log
      - name: Free temporary runner disk after all APK compilation
        run: python infrastructure/scripts/release-emulator-space.py
      - name: Allow the runner user to use hardware emulation
        run: if [ -e /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Manager emulator installation and launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: |
            python infrastructure/scripts/android-smoke.py app.javo.manager deliverables/apks/javo-manager-*.apk
            python infrastructure/scripts/android-integration.py
      - name: Preserve Android 15 Manager evidence
        run: |
          cp evidence/manager-runtime-smoke.json evidence/manager-api35-runtime-smoke.json
          cp evidence/manager-patch-integration.json evidence/manager-api35-patch-integration.json
          cp evidence/screenshots/manager-emulator.png evidence/screenshots/manager-api35-emulator.png
      - name: Android 10 Manager browser, transfer and patch regression check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          avd-name: javo-manager-api29
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: |
            python infrastructure/scripts/android-smoke.py app.javo.manager deliverables/apks/javo-manager-*.apk
            python infrastructure/scripts/android-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-development-and-evidence
          path: |
            deliverables/apks
            evidence/manager*
            evidence/screenshots/manager*
            apps/javo-manager/app/build/reports
            apps/javo-manager/app/build/outputs/apk/debug/*.apk
            apps/javo-manager/app/build/outputs/apk/androidTest/debug/*.apk
            patches/javo-branding/build/libs/*.rvp
  core:
    needs: sources
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build real GmsCore fork
        working-directory: apps/javo-core
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../../evidence
          ./gradlew :play-services-core:assembleVtmDefaultRelease :play-services-core:testVtmDefaultReleaseUnitTest :play-services-core:lintVtmDefaultRelease --no-daemon --no-configuration-cache --max-workers=2 --console=plain 2>&1 | tee ../../evidence/core-build.log
      - name: Reuse the working Core signing identity after matching its source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 624a2ae8974c9c9e93af76300e187694e6174eca
          git diff --exit-code FETCH_HEAD HEAD -- apps/javo-core
          mkdir -p tools/core-alpha2
          gh release download v0.1.0-alpha.2 --pattern javo-revanced-development.zip --dir tools/core-alpha2
          python infrastructure/scripts/reuse-verified-core.py
      - name: Verify Core APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py apps/javo-core/play-services-core/build/outputs/apk/vtmDefault/release/*.apk --sdk "$ANDROID_HOME" --product core --signing test
      - name: Audit consumer Core permissions and release flags
        run: python infrastructure/scripts/audit-core-apk.py deliverables/apks/javo-core-*.apk --sdk "$ANDROID_HOME"
      - name: Free temporary runner disk after all APK compilation
        run: python infrastructure/scripts/release-emulator-space.py
      - name: Allow the runner user to use hardware emulation
        run: if [ -e /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Emulator installation and launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: python infrastructure/scripts/android-smoke.py app.revanced.android.gms deliverables/apks/javo-core-*.apk
      - name: Preserve Android 10 Core evidence
        run: |
          cp evidence/core-runtime-smoke.json evidence/core-api29-runtime-smoke.json
          cp evidence/screenshots/core-emulator.png evidence/screenshots/core-api29-emulator.png
      - name: Android 15 Core installation and launch check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: javo-core-api35
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: python infrastructure/scripts/android-smoke.py app.revanced.android.gms deliverables/apks/javo-core-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-development-and-evidence
          path: |
            deliverables/apks
            evidence/core*
            evidence/screenshots/core*
            apps/javo-core/play-services-core/build/reports
            apps/javo-core/play-services-core/build/outputs/apk/vtmDefault/release/*.apk
  package:
    needs: [sources, web-and-security, manager, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-development-and-evidence'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: website-and-host-test-evidence
      - name: Reverify every APK and package corresponding source
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py deliverables/apks/javo-manager-*.apk --sdk "$ANDROID_HOME" --product manager --signing debug
          python infrastructure/scripts/verify-apk.py deliverables/apks/javo-core-*.apk --sdk "$ANDROID_HOME" --product core --signing test
          node --test tests/*.test.mjs
          node apps/javo-website/build.mjs
          mkdir -p deliverables/bundles
          cp patches/javo-branding/build/libs/*.rvp deliverables/bundles/
          python infrastructure/scripts/report-alpha2.py
          python infrastructure/scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: javo-verified-development-package
          path: |
            deliverables/javo-revanced-development.zip
            deliverables/SHA256SUMS
            deliverables/apks/*.apk
            deliverables/bundles/*.rvp
  release:
    needs: [sources, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-alpha.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: javo-verified-development-package
          path: tools/release-input
      - name: Publish the verified alpha update
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing.json"; then
              echo 'This release is already published.'
              exit 0
            fi
            jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' "$RUNNER_TEMP/existing.json"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'Javo ReVanced 0.1.0-alpha.3' --notes-file docs/RELEASE_ALPHA3.md
          fi
          mkdir -p tools/release-assets
          cp tools/release-input/javo-revanced-development.zip tools/release-input/apks/*.apk tools/release-input/bundles/*.rvp tools/release-assets/
          (cd tools/release-assets && sha256sum *.apk *.rvp *.zip > SHA256SUMS)
          gh release upload "$RELEASE_TAG" tools/release-assets/* --clobber
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/asset-info.json"
          for asset in tools/release-assets/*; do
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            jq -e --arg name "$(basename "$asset")" --arg digest "$digest" '.assets | any(.name == $name and .state == "uploaded" and .digest == $digest)' "$RUNNER_TEMP/asset-info.json"
          done
          gh release edit "$RELEASE_TAG" --draft=false
