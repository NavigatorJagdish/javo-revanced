name: Verify and package development builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: javo-verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.import.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the source commit for all verification jobs
        id: import
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  web-and-security:
    outputs:
      cache-key: ${{ format('javo-verify-host-{0}-{1}', github.run_id, github.run_attempt) }}
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Website and release tests
        run: |
          set -euo pipefail
          mkdir -p evidence tools/java-tests
          node --input-type=module -e "import fs from 'node:fs'; const p='infrastructure/release/catalog.json'; const c=JSON.parse(fs.readFileSync(p)); c.artifacts=[]; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          node --test tests/*.test.mjs | tee evidence/node-tests.log
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee evidence/runtime-evidence-tests.log
          javac -d tools/java-tests apps/javo-manager/app/src/main/java/app/javo/security/UpdateSecurity.java tests/UpdateSecurityTest.java patches/javo-branding/src/main/java/app/javo/branding/BrandingResources.java tests/BrandingResourcesTest.java apps/javo-manager/api/src/main/java/app/revanced/manager/downloader/DownloadConnection.java tests/DownloadConnectionTest.java apps/javo-manager/api/src/main/java/app/revanced/manager/downloader/webview/ApkMirrorPolicy.java tests/ApkMirrorPolicyTest.java
          java -cp tools/java-tests UpdateSecurityTest | tee evidence/java-security-tests.log
          javac -d tools/java-tests apps/javo-manager/app/src/main/java/app/javo/security/RootArguments.java tests/RootArgumentsTest.java
          java -cp tools/java-tests RootArgumentsTest
          javac -d tools/java-tests apps/javo-manager/app/src/main/java/app/javo/security/FrameworkCache.java tests/FrameworkCacheTest.java
          java -cp tools/java-tests FrameworkCacheTest | tee evidence/framework-cache-tests.log
          java -cp tools/java-tests BrandingResourcesTest | tee evidence/java-branding-tests.log
          java -cp tools/java-tests DownloadConnectionTest | tee evidence/java-download-tests.log
          java -cp tools/java-tests ApkMirrorPolicyTest | tee evidence/java-browser-tests.log
          node apps/javo-website/build.mjs
      - uses: actions/cache/save@v4
        with:
          key: ${{ format('javo-verify-host-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            apps/javo-website/dist
            evidence/node-tests.log
            evidence/java-security-tests.log
            evidence/java-branding-tests.log
            evidence/java-download-tests.log
            evidence/java-browser-tests.log
            evidence/runtime-evidence-tests.log
            evidence/framework-cache-tests.log
  publication-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inventory visibility risks without exposing credential contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infrastructure/scripts/publication-audit.py
  manager:
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      cache-key: ${{ format('javo-verify-manager-{0}-{1}', github.run_id, github.run_attempt) }}
    needs: sources
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit test and lint Manager
        working-directory: apps/javo-manager
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../../evidence
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --no-daemon --console=plain 2>&1 | tee ../../evidence/manager-build.log
      - name: Verify Manager APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py apps/javo-manager/app/build/outputs/apk/release/*.apk --sdk "$ANDROID_HOME" --product manager --signing development
          python infrastructure/scripts/audit-manager-apk.py deliverables/apks/javo-manager-*.apk --sdk "$ANDROID_HOME"
      - name: Build standalone branding bundle for external patchers
        working-directory: apps/javo-manager
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          ./gradlew -p ../../patches/javo-branding jar --no-daemon
          mkdir -p ../../patches/javo-branding/build/dex
          "$ANDROID_HOME/build-tools/34.0.0/d8" --min-api 26 --output ../../patches/javo-branding/build/dex ../../patches/javo-branding/build/libs/javo-branding-0.1.0-alpha.1.jar
          python ../../infrastructure/scripts/dex-bundle.py ../../patches/javo-branding/build/libs/javo-branding-0.1.0-alpha.1.jar ../../patches/javo-branding/build/dex/classes.dex
      - name: Export resolved ReVanced build artifacts without credentials
        if: always()
        run: python infrastructure/scripts/export-revanced-dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: resolved-revanced-maven-cache
          path: tools/revanced-maven
      - name: Prepare first-party patch integration fixtures
        working-directory: apps/javo-manager
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35'
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python ../../infrastructure/scripts/build-integration-fixture.py --sdk "$ANDROID_HOME"
          ./gradlew :app:assembleReleaseAndroidTest --no-daemon --console=plain 2>&1 | tee ../../evidence/manager-instrumentation-build.log
      - name: Free temporary runner disk after all APK compilation
        run: python infrastructure/scripts/release-emulator-space.py
      - name: Allow the runner user to use hardware emulation
        run: if [ -e /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Manager emulator installation and launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: |
            python infrastructure/scripts/android-smoke.py app.javo.manager deliverables/apks/javo-manager-*.apk
            python infrastructure/scripts/android-integration.py
      - name: Preserve Android 15 Manager evidence
        run: |
          cp evidence/manager-runtime-smoke.json evidence/manager-api35-runtime-smoke.json
          cp evidence/manager-patch-integration.json evidence/manager-api35-patch-integration.json
          cp evidence/screenshots/manager-emulator.png evidence/screenshots/manager-api35-emulator.png
      - name: Android 10 Manager browser, transfer and patch regression check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          avd-name: javo-manager-api29
          disk-size: 2048M
          ram-size: 4096M
          disable-animations: true
          script: |
            python infrastructure/scripts/android-smoke.py app.javo.manager deliverables/apks/javo-manager-*.apk
            python infrastructure/scripts/android-integration.py
      - name: Preserve tested Manager and instrumentation inputs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: manager-ci-verification-input-not-a-public-release
          path: |
            deliverables/apks/javo-manager-*.apk
            apps/javo-manager/app/build/outputs/apk/androidTest/release/*.apk
            evidence/manager-security-audit.json
            evidence/manager-patch-integration.json
            evidence/manager-api35-patch-integration.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/cache/save@v4
        with:
          key: ${{ format('javo-verify-manager-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            deliverables/apks/javo-manager-*.apk
            evidence/manager*
            evidence/screenshots/manager*
            apps/javo-manager/app/build/reports
            patches/javo-branding/build/libs/*.rvp
  core:
    outputs:
      cache-key: ${{ format('javo-verify-core-{0}-{1}', github.run_id, github.run_attempt) }}
    needs: sources
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build real GmsCore fork
        working-directory: apps/javo-core
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../../evidence
          ./gradlew :play-services-core-proto:test :play-services-auth-blockstore-core:testReleaseUnitTest :play-services-core:assembleVtmDefaultRelease :play-services-core:testVtmDefaultReleaseUnitTest :play-services-core:lintVtmDefaultRelease --no-daemon --no-configuration-cache --max-workers=2 --console=plain 2>&1 | tee ../../evidence/core-build.log
      - name: Verify Core APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py apps/javo-core/play-services-core/build/outputs/apk/vtmDefault/release/*.apk --sdk "$ANDROID_HOME" --product core --signing test
      - name: Audit consumer Core permissions and release flags
        run: python infrastructure/scripts/audit-core-apk.py deliverables/apks/javo-core-*.apk --sdk "$ANDROID_HOME"
      - name: Free temporary runner disk after all APK compilation
        run: python infrastructure/scripts/release-emulator-space.py
      - name: Allow the runner user to use hardware emulation
        run: if [ -e /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Emulator installation and launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: |
            python infrastructure/scripts/android-smoke.py app.revanced.android.gms deliverables/apks/javo-core-*.apk
            python infrastructure/scripts/android-core-boundaries.py deliverables/apks/javo-core-*.apk
      - name: Preserve Android 10 Core evidence
        run: |
          cp evidence/core-runtime-smoke.json evidence/core-api29-runtime-smoke.json
          cp evidence/screenshots/core-emulator.png evidence/screenshots/core-api29-emulator.png
      - name: Android 15 Core installation and launch check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: javo-core-api35
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: python infrastructure/scripts/android-smoke.py app.revanced.android.gms deliverables/apks/javo-core-*.apk
      - name: Preserve tested Core input for offline maintainer signing
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: core-ci-verification-build-not-a-public-release
          path: apps/javo-core/play-services-core/build/outputs/apk/vtmDefault/release/*.apk
          retention-days: 1
          if-no-files-found: error
          # This contains a disposable CI signature, never the offline release key.
      - uses: actions/cache/save@v4
        with:
          key: ${{ format('javo-verify-core-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            deliverables/apks/javo-core-*.apk
            evidence/core*
            evidence/screenshots/core*
            apps/javo-core/play-services-core/build/reports
  package:
    outputs:
      cache-key: ${{ format('javo-verify-package-{0}-{1}', github.run_id, github.run_attempt) }}
    needs: [sources, web-and-security, manager, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sources.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # Run-scoped cache entries carry verified outputs between jobs. Cache storage is
      # separate from the Actions artifact quota and contains no signing material.
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.manager.outputs.cache-key }}
          fail-on-cache-miss: true
          path: |
            deliverables/apks/javo-manager-*.apk
            evidence/manager*
            evidence/screenshots/manager*
            apps/javo-manager/app/build/reports
            patches/javo-branding/build/libs/*.rvp
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.core.outputs.cache-key }}
          fail-on-cache-miss: true
          path: |
            deliverables/apks/javo-core-*.apk
            evidence/core*
            evidence/screenshots/core*
            apps/javo-core/play-services-core/build/reports
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs['web-and-security'].outputs.cache-key }}
          fail-on-cache-miss: true
          path: |
            apps/javo-website/dist
            evidence/node-tests.log
            evidence/java-security-tests.log
            evidence/java-branding-tests.log
            evidence/java-download-tests.log
            evidence/java-browser-tests.log
            evidence/runtime-evidence-tests.log
            evidence/framework-cache-tests.log
      - name: Reverify every APK and package corresponding source
        run: |
          set -euo pipefail
          node --input-type=module -e "import fs from 'node:fs'; const p='infrastructure/release/catalog.json'; const c=JSON.parse(fs.readFileSync(p)); c.status='release-review'; c.artifacts=[]; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py deliverables/apks/javo-manager-*.apk --sdk "$ANDROID_HOME" --product manager --signing development
          python infrastructure/scripts/verify-apk.py deliverables/apks/javo-core-*.apk --sdk "$ANDROID_HOME" --product core --signing test
          node --test tests/*.test.mjs
          node apps/javo-website/build.mjs
          mkdir -p deliverables/bundles
          cp patches/javo-branding/build/libs/*.rvp deliverables/bundles/
          python infrastructure/scripts/report-alpha2.py
          python infrastructure/scripts/package.py
      - uses: actions/cache/save@v4
        with:
          key: ${{ format('javo-verify-package-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            deliverables/javo-revanced-development.zip
            deliverables/SHA256SUMS
            deliverables/apks/*.apk
            deliverables/bundles/*.rvp
