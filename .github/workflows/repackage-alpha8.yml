name: Package the verified alpha.8 APKs
on:
  push:
    branches: [main]
    paths: [.github/workflows/repackage-alpha8.yml]
permissions:
  contents: read
  actions: read
jobs:
  repackage:
    if: github.repository == 'NavigatorJagdish/javo-revanced' && github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-alpha.8
      JAVO_VERIFICATION_RUN_ID: "42468669833"
      VERIFIED_SOURCE_SHA: "0a44b5f3123b2eda8f9224f0227c679c5364ec28"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the original verification and unchanged Android inputs
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$JAVO_VERIFICATION_RUN_ID" |
            jq -e --arg sha "$VERIFIED_SOURCE_SHA" '.head_sha == $sha and .event == "push" and .run_attempt == 1'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$JAVO_VERIFICATION_RUN_ID/jobs?per_page=100" |
            jq -e '(.jobs | map(select(.conclusion == "success") | .name)) as $passed |
              ["sources", "publication-audit", "web-and-security", "manager", "core"] - $passed == []'
          git diff --name-only "$VERIFIED_SOURCE_SHA" HEAD |
            while IFS= read -r changed; do
              case "$changed" in
                packages/release-schema/validate.mjs|tests/release.test.mjs|infrastructure/scripts/report-alpha2.py|.github/workflows/repackage-alpha8.yml) ;;
                *) echo "Unexpected change after APK verification: $changed"; exit 1 ;;
              esac
            done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # Run-scoped cache entries carry verified outputs between jobs. Cache storage is
      # separate from the Actions artifact quota and contains no signing material.
      - uses: actions/cache/restore@v4
        with:
          key: javo-verify-manager-42468669833-1
          fail-on-cache-miss: true
          path: |
            deliverables/apks/javo-manager-*.apk
            evidence/manager*
            evidence/screenshots/manager*
            apps/javo-manager/app/build/reports
            patches/javo-branding/build/libs/*.rvp
      - uses: actions/cache/restore@v4
        with:
          key: javo-verify-core-42468669833-1
          fail-on-cache-miss: true
          path: |
            deliverables/apks/javo-core-*.apk
            evidence/core*
            evidence/screenshots/core*
            apps/javo-core/play-services-core/build/reports
      - uses: actions/cache/restore@v4
        with:
          key: javo-verify-host-42468669833-1
          fail-on-cache-miss: true
          path: |
            apps/javo-website/dist
            evidence/node-tests.log
            evidence/java-security-tests.log
            evidence/java-branding-tests.log
            evidence/java-download-tests.log
            evidence/java-browser-tests.log
            evidence/runtime-evidence-tests.log
      - name: Reverify every APK and package corresponding source
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0'
          python infrastructure/scripts/verify-apk.py deliverables/apks/javo-manager-*.apk --sdk "$ANDROID_HOME" --product manager --signing development
          python infrastructure/scripts/verify-apk.py deliverables/apks/javo-core-*.apk --sdk "$ANDROID_HOME" --product core --signing test
          node --test tests/*.test.mjs
          node apps/javo-website/build.mjs
          mkdir -p deliverables/bundles
          cp patches/javo-branding/build/libs/*.rvp deliverables/bundles/
          python infrastructure/scripts/report-alpha2.py
          python infrastructure/scripts/package.py
      - name: Publish the verified alpha update
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing.json"; then
              echo 'This release is already published.'
              exit 0
            fi
            jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' "$RUNNER_TEMP/existing.json"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'Javo ReVanced 0.1.0-alpha.8' --notes-file docs/RELEASE_ALPHA8.md
          fi
          mkdir -p tools/release-assets
          cp deliverables/javo-revanced-development.zip deliverables/apks/*.apk deliverables/bundles/*.rvp tools/release-assets/
          (cd tools/release-assets && sha256sum *.apk *.rvp *.zip > SHA256SUMS)
          gh release upload "$RELEASE_TAG" tools/release-assets/* --clobber
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/asset-info.json"
          for asset in tools/release-assets/*; do
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            jq -e --arg name "$(basename "$asset")" --arg digest "$digest" '.assets | any(.name == $name and .state == "uploaded" and .digest == $digest)' "$RUNNER_TEMP/asset-info.json"
          done
          gh release edit "$RELEASE_TAG" --draft=false
